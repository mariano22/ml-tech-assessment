version: '3.8'

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=dev
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy_key}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - PYTHONPATH=/app
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./htmlcov:/app/htmlcov
    command: >
      sh -c "poetry run pytest -v"

  test-coverage:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=dev
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy_key}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - PYTHONPATH=/app
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./htmlcov:/app/htmlcov
    command: >
      sh -c "poetry run pytest --cov=app --cov-report=html tests/" 